<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ViewCash - Watch. Win. Redeem.</title>
    <meta name="description" content="A modern rewards and lucky draw app where users earn tickets, participate in draws, and redeem rewards securely." />
    <meta name="theme-color" content="#FF8008" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Google Fonts - Inter for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* CRITICAL: Set orange on ALL root elements immediately — before any JS or external CSS loads */
      html, body, #root {
        background: linear-gradient(135deg, #FFC837 0%, #FF8008 100%);
        background-color: #FF8008;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .preloader-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
      }
      .preloader-logo-container {
        text-align: center;
        animation: preloader-pulse 2s infinite ease-in-out;
      }
      .preloader-logo-text {
        font-size: 40px;
        font-weight: 800;
        margin: 0 0 6px 0;
        letter-spacing: -0.5px;
        color: #2B3674;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .preloader-logo-text span {
        color: #FF8008;
      }
      .preloader-tagline {
        font-size: 15px;
        font-weight: 500;
        opacity: 0.85;
        color: rgba(255,255,255,0.9);
        margin: 0;
        letter-spacing: 0.5px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .preloader-coin {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        animation: preloader-pulse 2s infinite ease-in-out;
      }
      .preloader-loader {
        margin-top: 48px;
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: preloader-spin 0.9s ease-in-out infinite;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.06); }
        100% { transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <!-- Inline orange bg on #root via style attribute — guaranteed to show before any CSS file is parsed -->
    <div id="root" style="background:linear-gradient(135deg,#FFC837 0%,#FF8008 100%);background-color:#FF8008;min-height:100vh;">
      <div class="preloader-container">
        <div class="preloader-logo-container">
          <!-- Inline SVG logo — zero network request, renders at the exact same time as the HTML -->
          <svg class="preloader-coin" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="pre_glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFC837" stop-opacity="0.25" />
                <stop offset="100%" stop-color="#FFC837" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="pre_coin" x1="28" y1="28" x2="72" y2="72" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FFC837" />
                <stop offset="1" stop-color="#FF8008" />
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="48" fill="url(#pre_glow)" />
            <path d="M12 50C12 50 28 28 50 28C72 28 88 50 88 50C88 50 72 72 50 72C28 72 12 50 12 50Z" stroke="#FF8008" stroke-width="4" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="22" fill="url(#pre_coin)" />
            <text x="50" y="59" text-anchor="middle" fill="white" style="font-size:24px;font-weight:800;font-family:'Inter',system-ui,sans-serif;">&#x20B9;</text>
          </svg>
          <h1 class="preloader-logo-text">View<span>Cash</span></h1>
          <p class="preloader-tagline">Watch. Win. Redeem.</p>
        </div>
        <div class="preloader-loader"></div>
      </div>
    </div>
    <div id="recaptcha-container"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
