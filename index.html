<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ViewCash - Watch. Win. Redeem.</title>
    <meta name="description" content="A modern rewards and lucky draw app where users earn tickets, participate in draws, and redeem rewards securely." />
    <!-- theme-color = orange — Android WebAPK shows orange status bar + white icons immediately -->
    <meta name="theme-color" content="#FF8008" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Google Fonts - Inter for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* ── Critical: paint orange INSTANTLY before any JS or CSS loads ── */
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #FF8008;            /* solid color first — no gradient flash */
        background-color: #FF8008;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* #root always stays orange until app-loaded class is added */
      #root {
        min-height: 100vh;
        background: linear-gradient(135deg, #FFC837 0%, #FF8008 100%);
        background-color: #FF8008;
      }

      /* ── HTML Preloader — shown before React loads ─────────────────── */
      #html-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #FFC837 0%, #FF8008 100%);
        /* Smooth fade when React splash takes over */
        transition: opacity 0.15s ease;
      }

      .pre-logo-anim {
        animation: pre-pulse 2s ease-in-out infinite;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .pre-coin {
        width: 110px;
        height: 110px;
        margin-bottom: 18px;
        animation: pre-pulse 2s ease-in-out infinite;
      }

      .pre-brand {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #2B3674;
        line-height: 1;
        margin: 0;
        font-family: 'Inter', -apple-system, sans-serif;
      }

      .pre-brand span { color: #FF8008; }

      .pre-tagline {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: rgba(255,255,255,0.88);
        font-family: 'Inter', -apple-system, sans-serif;
      }

      .pre-spinner-wrap {
        position: absolute;
        bottom: 80px;
      }

      .pre-spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: pre-spin 0.85s ease-in-out infinite;
      }

      @keyframes pre-spin   { to { transform: rotate(360deg); } }
      @keyframes pre-pulse  {
        0%,100% { transform: scale(1); }
        50%     { transform: scale(1.06); }
      }
    </style>
  </head>
  <body>
    <!-- Static HTML preloader — visible from frame 0, before React loads -->
    <!-- React's Splash component will fade this out and remove it from DOM -->
    <div id="html-preloader">
      <div class="pre-logo-anim">
        <!-- Inline SVG coin — zero network request, renders immediately -->
        <svg class="pre-coin" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="pre_glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#FFC837" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#FFC837" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="pre_coin" x1="28" y1="28" x2="72" y2="72" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFC837" />
              <stop offset="1" stop-color="#FF8008" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="48" fill="url(#pre_glow)" />
          <path d="M12 50C12 50 28 28 50 28C72 28 88 50 88 50C88 50 72 72 50 72C28 72 12 50 12 50Z"
                stroke="#FF8008" stroke-width="4" stroke-linecap="round"/>
          <circle cx="50" cy="50" r="22" fill="url(#pre_coin)" />
          <text x="50" y="59" text-anchor="middle" fill="white"
                style="font-size:24px;font-weight:800;font-family:'Inter',system-ui,sans-serif;">&#x20B9;</text>
        </svg>

        <h1 class="pre-brand">View<span>Cash</span></h1>
        <p class="pre-tagline">Watch. Win. Redeem.</p>
      </div>

      <div class="pre-spinner-wrap">
        <div class="pre-spinner"></div>
      </div>
    </div>

    <!-- React mounts here — starts invisible until splash component fades in -->
    <div id="root"></div>
    <div id="recaptcha-container"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
